# Supabase local/dev config. Schedules are applied on deploy when supported;
# confirm in Dashboard → Edge Functions → notification-worker → Schedules.
#
# Deploy from repo root (required for functions that use _shared/):
#   supabase functions deploy notification-worker
#   supabase functions deploy notify-household-event
#   supabase functions deploy process-scheduled-notifications
#   supabase functions deploy recall-scan
#   supabase functions deploy homekeep-ai
#   supabase functions deploy calendar-feed
#
# homekeep-ai secrets: supabase secrets set GEMINI_API_KEY=... [GEMINI_MODEL=gemini-3.5-flash-lite]
#
# send-push-notification is self-contained and can be deployed via Dashboard.

[functions.notification-worker]
import_map = "./functions/deno.json"
verify_jwt = false

[functions.send-push-notification]
verify_jwt = false

[functions.process-scheduled-notifications]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.notify-household-event]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.revenuecat-webhook]
verify_jwt = false

# Daily CPSC recall scan; privileged callers only (service role or x-cron-secret).
[functions.recall-scan]
verify_jwt = false
import_map = "./functions/deno.json"

# Gemini-backed AI tasks; authenticates the user JWT itself.
[functions.homekeep-ai]
verify_jwt = false
import_map = "./functions/deno.json"

# ICS subscription; calendar apps can't send a JWT, so the feed token is the credential.
[functions.calendar-feed]
verify_jwt = false
import_map = "./functions/deno.json"
